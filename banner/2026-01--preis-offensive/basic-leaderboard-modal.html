<style data-id="basic-leaderboard-modal--preis-offensive" data-version="2026-01-22_002">

        position: fixed;

        /* screen-reader only helper */

            padding: 0; margin: -1px;

        }

        /* Respect reduced motion preferences: disable transitions when user opts out */
        @media (prefers-reduced-motion: reduce) {

            .overlay-banner.basic-leaderboard-modal--preis-offensive img.banner-marketing__image,

        button#overlayBanner-close-preisOffensive-2026-01,

}

                  loading="lazy"
                  srcset="https://compass-test.b-cdn.net/media/3b/45/4d/1768387878/COM_2026_01_Preisoffensive_Banner_FS26-de-desk.jpg?width=480 480w, https://compass-test.b-cdn.net/media/3b/45/4d/1768387878/COM_2026_01_PreisOffensive_Banner_FS26-de-desk.jpg?width=768 768w, https://compass-test.b-cdn.net/media/3b/45/4d/1768387878/COM_2026_01_PreisOffensive_Banner_FS26-de-desk.jpg?width=1200 1200w, https://compass-test.b-cdn.net/media/3b/45/4d/1768387878/COM_2026_01_PreisOffensive_Banner_FS26-de-desk.jpg?width=1920 1920w"

<script data-id="basic-leaderboard-modal--preis-offensive" data-version="2026-01-22_002">
/**
 * Preis-Offensive Banner Experience
 * 
 * This script manages a promotional overlay banner with multi-language support.
 * It uses specific element IDs to avoid conflicts when injected into pages.
 * 
 * @see README.md for configuration and deployment instructions
 */
(function() {
    'use strict';

    /* ========================================================================= */
    /* CONFIGURATION */
    /* ========================================================================= */
    const BANNER_CONFIG = {
        /* Banner behavior */
        position: 'bottom', /* 'top' or 'bottom' */
        storageKey: 'bannerClosed_preisOffensive_2026-01', /* Unique localStorage key */
        DEBUG: true,
        delay: 5000, /* Delay in ms before showing banner */
        
        /* Experience identification */
        experienceId: 'basic-leaderboard-modal--preis-offensive-2026-01',

        /* Language setting - match to deployment sales channel */
        language: 'ch', /* e.g. 'de', 'dk', 'es', 'fr', 'ch' (it will be decided via code whether 'ch-fr' or 'ch-de'), 'gb', 'it', 'nl', 'pl', 'se' */

        /* Element IDs (must match HTML) */
        elementIds: {
            banner: 'overlayBanner-preisOffensive-2026-01',
            link: 'overlayBanner-link-preisOffensive-2026-01',
            image: 'overlayBanner-image-preisOffensive-2026-01'
        },
        
        /* Language-specific content */
        data: {
            'de': {
                imageSrc: 'https://compass24.b-cdn.net/media/3c/2a/04/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-de-desk.jpg?width=1920',
                imageAlt: 'Compass Preis-Offensive',
                linkUrl: '/compass-preisoffensive'
            },
            'dk': {
                imageSrc: 'https://compass24.b-cdn.net/media/ff/5b/40/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-dk-desk.jpg?width=1920',
                imageAlt: 'Compass Pris-Offensiv',
                linkUrl: '/pris-offensiv'
            },
            'es': {
                imageSrc: 'https://compass24.b-cdn.net/media/f2/d7/82/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-es-desk.jpg?width=1920',
                imageAlt: 'Compass Offensiva de Precios',
                linkUrl: '/ofensiva-de-precios'
            },
            'fr': {
                imageSrc: 'https://compass24.b-cdn.net/media/b9/9d/16/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-fr-desk.jpg?width=1920',
                imageAlt: 'Compass Offensive sur les Prix',
                linkUrl: '/offensive-sur-les-prix'
            },
            'ch-de': {
                imageSrc: 'https://compass24.b-cdn.net/media/3c/2a/04/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-de-desk.jpg?width=1920',
                imageAlt: 'Compass Preis-Offensive',
                linkUrl: '/compass-preisoffensive'
            },
            'ch-fr': {
                imageSrc: 'https://compass24.b-cdn.net/media/b9/9d/16/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-fr-desk.jpg?width=1920',
                imageAlt: 'Compass Offensive sur les Prix',
                linkUrl: '/ch-fr/offensive-sur-les-prix'
            },
            'gb': {
                imageSrc: 'https://compass24.b-cdn.net/media/1f/d4/f8/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-gb-desk.jpg?width=1920',
                imageAlt: 'Compass Price-Offensive',
                linkUrl: '/price-offensive'
            },
            'it': {
                imageSrc: 'https://compass24.b-cdn.net/media/8d/d4/28/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-it-desk.jpg?width=1920',
                imageAlt: 'Compass Offensiva sui Prezzi',
                linkUrl: '/offensiva-sui-prezzi'
            },
            'nl': {
                imageSrc: 'https://compass24.b-cdn.net/media/1a/32/80/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-nl-desk.jpg?width=1920',
                imageAlt: 'Compass Prijs-Offensief',
                linkUrl: '/prijs-offensief'
            },
            'pl': {
                imageSrc: 'https://compass24.b-cdn.net/media/eb/89/c2/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-pl-desk.jpg?width=1920',
                imageAlt: 'Compass Ofensywa Cenowa',
                linkUrl: '/ofensywa-cenowa'
            },
            'se': {
                imageSrc: 'https://compass24.b-cdn.net/media/24/21/4e/1768978339/COM_2026_01_Preisoffensive_Banner_FS26-se-desk.jpg?width=1920',
                imageAlt: 'Compass Pris-Offensiv',
                linkUrl: '/pris-offensiv'
            }
        },
        
        /* Path restrictions (empty array = show on all paths) */
        allowedPaths: []
    };

    /* ========================================================================= */
    /* HELPER FUNCTIONS */
    /* ========================================================================= */
    
    /**
     * Logs debug messages when DEBUG mode is enabled
     * @param {string} message - Message to log
     * @param {*} [data] - Optional data to include
     */
    function log(message, data) {
        if (!BANNER_CONFIG.DEBUG) return;
        const prefix = '[Banner:' + BANNER_CONFIG.experienceId + ']';
        if (data !== undefined) {
            console.info(prefix, message, data);
        } else {
            console.info(prefix, message);
        }
    }

    /**
     * Safely gets an element by ID with null check
     * @param {string} id - Element ID
     * @returns {HTMLElement|null}
     */
    function getElement(id) {
        var element = document.getElementById(id);
        if (!element) {
            log('Element not found: #' + id);
        }
        return element;
    }

    /**
     * Gets the language-specific data from configuration
     * @returns {Object|null} Language data or null if not found
     */
    function getLanguageData() {
        var lang = BANNER_CONFIG.language;

        /* Special handling for Swiss languages */
        if (lang === 'ch') {
            /* If path contains 'ch-fr/ use 'ch-fr', else 'ch-de' */
            if (window.location.pathname.includes('/ch-fr/')) {
                lang = 'ch-fr';
            } else {
                lang = 'ch-de';
            }
        }


        var data = BANNER_CONFIG.data[lang];
        
        if (!data) {
            log('No data found for language: ' + lang);
            return null;
        }
        
        return data;
    }

    /*
     * Build responsive image URLs and srcset
     */
    function getSrcWithWidth(src, width) {
        if (!src) return src;
        try {
            if (/([?&])width=\d+/.test(src)) {
                return src.replace(/([?&])width=\d+/, '$1width=' + width);
            }
            return src + (src.indexOf('?') === -1 ? '?' : '&') + 'width=' + width;
        } catch (e) {
            log('getSrcWithWidth error:', e.message);
            return src;
        }
    }

    function buildSrcSet(src) {
        var widths = [480, 768, 1200, 1920];
        return widths.map(function(w) { return getSrcWithWidth(src, w) + ' ' + w + 'w'; }).join(', ');
    }

    /**
     * Checks if current path is in the allowed paths list
     * @returns {boolean}
     */
    function isPathAllowed() {
        if (BANNER_CONFIG.allowedPaths.length === 0) {
            return true;
        }
        
        var currentPath = window.location.pathname;
        return BANNER_CONFIG.allowedPaths.some(function(path) {
            return currentPath === path || currentPath.startsWith(path);
        });
    }

    /**
     * Applies language-specific content to banner elements
     * @param {Object} langData - Language-specific configuration
     * @returns {boolean} True if successful
     */
    function applyLanguageContent(langData) {
        var linkEl = getElement(BANNER_CONFIG.elementIds.link);
        var imageEl = getElement(BANNER_CONFIG.elementIds.image);
        
        if (!linkEl || !imageEl) {
            log('Required elements not found, cannot apply language content');
            return false;
        }
        
        /* Apply link URL */
        linkEl.href = langData.linkUrl;

        /* Apply image source and alt text */
        imageEl.src = langData.imageSrc;
        imageEl.alt = langData.imageAlt;
        /* Responsive attributes */
        try {
            imageEl.loading = 'lazy';
            imageEl.srcset = buildSrcSet(langData.imageSrc);
            imageEl.sizes = '(max-width: 480px) 90vw, (max-width: 768px) 95vw, 350px';
        } catch (e) {
            log('Could not set responsive attributes:', e.message);
        }
        
        log('Applied language content:', langData);
        return true;
    }

    /* ========================================================================= */
    /* BANNER CONTROL FUNCTIONS */
    /* ========================================================================= */

    function initBanner() {
        log('Initializing banner...');
        var banner = getElement(BANNER_CONFIG.elementIds.banner);
        var closeBtn = getElement('overlayBanner-close-preisOffensive-2026-01');
        var announcementEl = getElement('overlayBanner-announcement-preisOffensive-2026-01');
        var previousActiveElement = null;
        if (!banner) {
            log('Banner element not found, aborting initialization');
            return;
        }

        /* Check path restrictions */
        if (!isPathAllowed()) {
            log('Current path not allowed:', window.location.pathname);
            return;
        }

        /* Check if previously closed (persistent) or already seen (session) */
        try {
            if (localStorage.getItem(BANNER_CONFIG.storageKey) === 'true') {
                log('Banner was previously closed in this browser');
                return;
            }
            if (sessionStorage.getItem('bannerSeen') === 'true') {
                log('Banner already seen in this session');
                return;
            }
        } catch (e) {
            log('localStorage/sessionStorage not available:', e.message);
        }

        /* Get and apply language-specific content */
        var langData = getLanguageData();
        if (!langData) {
            log('No language data available, aborting');
            return;
        }

        if (!applyLanguageContent(langData)) {
            log('Failed to apply language content, aborting');
            return;
        }
        /* Set position and show banner after delay */
        banner.classList.add(BANNER_CONFIG.position);
        /* attach close handler if button exists */
        if (closeBtn) {
            try { closeBtn.addEventListener('click', closeBanner); } catch (e) {}
        }

        setTimeout(function() {
            /* Show the banner only after the image has loaded to avoid layout flash. */
            var showBanner = function() {
                previousActiveElement = document.activeElement;
                try {
                    requestAnimationFrame(function() { banner.classList.add('visible'); });
                } catch (e) {
                    setTimeout(function() { banner.classList.add('visible'); }, 20);
                }

                /* focus management: focus close button for keyboard users */
                // try { if (closeBtn) closeBtn.focus(); } catch (e) {}

                try {
                    if (announcementEl) announcementEl.textContent = 'Promotional banner: Preis-Offensive';
                } catch (e) {}

                try { 
                    sessionStorage.setItem('bannerSeen', 'true'); 
                }
                catch (e) { 
                    log('Could not set sessionStorage bannerSeen:', e.message); 
                }
                log('Banner displayed after delay');
            };

            var imgEl = getElement(BANNER_CONFIG.elementIds.image);
            if (imgEl) {
                if (imgEl.complete && imgEl.naturalWidth > 0) {
                    /* already loaded */
                    showBanner();
                } else {
                    var onFinish = function() {
                        try { 
                            imgEl.removeEventListener('load', onFinish); 
                            imgEl.removeEventListener('error', onFinish); 
                        } 
                        catch (e) {}
                        showBanner();
                    };
                    imgEl.addEventListener('load', onFinish, { once: true });
                    imgEl.addEventListener('error', onFinish, { once: true });
                    /* Safety fallback: show after max wait even if image doesn't fire events */
                    var maxWait = 1500; /* ms */
                    setTimeout(function() {
                        if (!banner.classList.contains('visible')) {
                            showBanner();
                        }
                    }, maxWait);
                }
            } else {
                showBanner();
            }
        }, BANNER_CONFIG.delay);

        /* keyboard: close on Escape when banner visible */
        var escHandler = function(e) {
            if (e.key === 'Escape' || e.key === 'Esc') {
                closeBanner();
            }
        };
        try { document.addEventListener('keydown', escHandler); } catch (e) {}

        /* restore focus when closed (closeBanner will handle persistence and hiding) */
        var originalClose = closeBanner;
        closeBanner = function() {
            try { document.removeEventListener('keydown', escHandler); } catch (e) {}
            try {
                if (previousActiveElement && typeof previousActiveElement.focus === 'function') {
                    previousActiveElement.focus();
                }
            } catch (e) {}
            originalClose();
        };
    }

    function closeBanner() {
        var banner = getElement(BANNER_CONFIG.elementIds.banner);
        if (!banner) return;
        /* fade out by removing visible class, then hide and persist after transition */
        try {
            banner.classList.remove('visible');
        } catch (e) {
            /* ignore */
        }
        var hideDelay = 600; /* ms - allow full fade-out before hiding */
        setTimeout(function() {
            try { banner.style.display = 'none'; } catch (e) {}
            try {
                localStorage.setItem(BANNER_CONFIG.storageKey, 'true');
                log('Banner closed and preference saved');
            }
            catch (e) {
                log('Could not save to localStorage:', e.message);
            }
        }, hideDelay);
    }

    /* ========================================================================= */
    /* GLOBAL API (for console testing/debugging) */
    /* ========================================================================= */
    window.PreisOffensiveBanner = {
        config: BANNER_CONFIG,
        init: initBanner,
        close: closeBanner,
        getLanguageData: getLanguageData,
        isPathAllowed: isPathAllowed,
        
        reset: function() {
            try { 
                localStorage.removeItem(BANNER_CONFIG.storageKey);
                sessionStorage.removeItem('bannerSeen');
                log('Banner state reset (localStorage and sessionStorage cleared)'); 
            } 
            catch (e) { 
                log('Could not reset:', e.message);
            }
        },
        
        /**
         * Changes the language and reinitializes
         * @param {string} lang - Language code
         */
        setLanguage: function(lang) {
            if (BANNER_CONFIG.data[lang]) {
                BANNER_CONFIG.language = lang;
                log('Language changed to:', lang);
                this.reset();
                initBanner();
            } else {
                console.warn('Available languages:', Object.keys(BANNER_CONFIG.data).join(', '));
            }
        }
    };

    /* ========================================================================= */
    /* INITIALIZATION */
    /* ========================================================================= */
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initBanner);
    } else {
        initBanner();
    }

})();
</script>
